name: Build Android APK

# يشتغل تلقائيًا مع كل push على main، وكمان يديك زرار تشغيل يدوي
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (مطلوب لـ Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      
      - name: Copy google-services.json into Android project
        run: cp google-services.json android/app/google-services.json

      - name: Sync Capacitor
        run: npx cap sync android

      # 🔥 خطوتين جديدتين — كانوا ناقصين، وهما سبب عدم اكتمال
      # تفعيل Firebase Native + الصوت المخصص على أندرويد:

      - name: Place google-services.json (Firebase native config)
        run: cp google-services.json android/app/google-services.json

      - name: Add custom notification sound as Android raw resource
        run: |
          mkdir -p android/app/src/main/res/raw
          cp cha_ching.mp3 android/app/src/main/res/raw/cha_ching.mp3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wind-admin-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
